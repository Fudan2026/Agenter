name: Weekly AI ratings bake

on:
  schedule:
    - cron: "0 9 * * 1" # Monday ~09:00 UTC
  workflow_dispatch:

jobs:
  ratings:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Bake AI ratings (Arena / AA overlay)
        run: npm run ai-ratings:bake
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ai-ratings.json || true
          if git diff --cached --quiet; then
            echo "No ratings changes"
          else
            git commit -m "chore(bake): weekly AI ratings refresh"
            git push
          fi
