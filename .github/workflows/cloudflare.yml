name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Bake quant data
        run: npm run quant:bake
        continue-on-error: true

      - name: Bake factor board
        run: npm run factors:bake
        continue-on-error: true

      - name: Bake factor IC / corr
        run: npm run factors:ic-bake
        continue-on-error: true

      - name: Bake AI news
        run: npm run news:bake
        continue-on-error: true

      - name: Bake A-share announcements
        run: npm run announcements:bake
        continue-on-error: true
        env:
          IWENCAI_API_KEY: ${{ secrets.IWENCAI_API_KEY }}

      - name: Bake Iwencai finance news
        run: npm run iwencai-news:bake
        continue-on-error: true
        env:
          IWENCAI_API_KEY: ${{ secrets.IWENCAI_API_KEY }}

      - name: Bake index snapshot
        run: npm run indices:bake
        continue-on-error: true
        env:
          IWENCAI_API_KEY: ${{ secrets.IWENCAI_API_KEY }}

      - name: Bake editorial screens
        run: npm run screens:bake
        continue-on-error: true
        env:
          IWENCAI_API_KEY: ${{ secrets.IWENCAI_API_KEY }}

      - name: Bake AI ratings overlay
        run: npm run ai-ratings:bake
        continue-on-error: true

      - name: Bake Fin Desk corpus
        run: npm run fin-corpus:bake
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify CF secrets
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" && echo "CF_API_TOKEN: set" || echo "CF_API_TOKEN: MISSING"
          test -n "$CF_ACCT" && echo "CF_ACCOUNT_ID: set" || echo "CF_ACCOUNT_ID: MISSING"

      # Pages Functions read SUPABASE_* at runtime. VITE_* alone (build-time) is NOT enough.
      # Sync from GitHub secrets into Cloudflare Pages project `supro` before deploy.
      - name: Sync Pages Function secrets
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GH_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GH_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          GH_VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GH_LLM_BACKEND: ${{ secrets.LLM_BACKEND }}
          GH_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GH_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GH_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          set +x
          put() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "pages secret $name: skipped (empty)"
              return 0
            fi
            printf '%s' "$val" | npx wrangler pages secret put "$name" --project-name=supro
            echo "pages secret $name: set (len ${#val})"
          }

          URL_VAL="${GH_SUPABASE_URL:-$GH_VITE_SUPABASE_URL}"
          ANON_VAL="${GH_SUPABASE_ANON_KEY:-$GH_VITE_SUPABASE_ANON_KEY}"
          LLM_KEY_VAL="${GH_LLM_API_KEY:-$GH_DEEPSEEK_API_KEY}"
          put SUPABASE_URL "$URL_VAL"
          put SUPABASE_ANON_KEY "$ANON_VAL"
          put SUPABASE_SERVICE_ROLE_KEY "$GH_SUPABASE_SERVICE_ROLE_KEY"
          put LLM_BACKEND "${GH_LLM_BACKEND:-deepseek}"
          put LLM_API_KEY "$LLM_KEY_VAL"
          put DEEPSEEK_API_KEY "${GH_DEEPSEEK_API_KEY:-$LLM_KEY_VAL}"
          put LLM_MODEL "${GH_LLM_MODEL:-deepseek-chat}"
          put LLM_BASE_URL "${GH_LLM_BASE_URL:-https://api.deepseek.com}"

          if [ -z "$URL_VAL" ] || [ -z "$ANON_VAL" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY empty — /api/signup will return cloud_not_configured until Pages Production env is set."
          fi
          if [ -z "$LLM_KEY_VAL" ]; then
            echo "::warning::LLM_API_KEY / DEEPSEEK_API_KEY empty in GitHub secrets — Fin Desk will return llm_not_configured until Cloudflare Pages Production has LLM_API_KEY set and redeployed. Check GET /api/fin-health"
          fi

          if npx wrangler pages secret list --project-name=supro >/tmp/pages-secret-names 2>/dev/null; then
            echo "pages secret names (values omitted):"
            cat /tmp/pages-secret-names
            if ! grep -q 'LLM_API_KEY\|DEEPSEEK_API_KEY' /tmp/pages-secret-names; then
              echo "::warning::Pages project missing LLM_API_KEY / DEEPSEEK_API_KEY — Supro Model stays offline until set."
            fi
          else
            echo "pages secret list unavailable; continuing"
          fi

      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=supro --branch=main --commit-dirty=true
